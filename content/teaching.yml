head:
  kicker: Teaching
  heading: Teaching and mentoring
  lede: I teach with an emphasis on fieldwork and hands-on experience, and I enjoy helping students develop their own research projects.
meta_description: "Teaching and mentoring by Meaghan N. Evans: field-based mammalogy, wildlife techniques and student research mentoring."

