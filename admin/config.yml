              - { name: body, label: Text, widget: markdown }
              - { name: papers, label: Key papers, widget: list, field: { name: item, label: Paper, widget: string } }
              - { name: image, label: Photo, widget: image, required: false }
              - { name: image_alt, label: Photo description, widget: string }
