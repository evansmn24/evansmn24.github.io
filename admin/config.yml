# Site editor configuration (Sveltia CMS).
# Edits are saved as commits to the repository; the "Build site pages" GitHub
# Action then regenerates the HTML and GitHub Pages publishes it.
backend:
  name: github
  repo: evansmn24/evansmn24.github.io
  branch: main
  base_url: https://REPLACE-WITH-AUTH-WORKER.workers.dev
  commit_messages:
    create: "Add {{collection}} “{{slug}}”"
    update: "Edit {{slug}} via site editor"
    delete: "Delete {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

site_url: https://meaghanevans.science
display_url: https://meaghanevans.science
logo_url: https://meaghanevans.science/favicon.svg
media_folder: assets/img
public_folder: assets/img
locale: en
editor:
  preview: false

collections:
  - name: pages
    label: Pages
    description: Edit the words on each page. Changes go live a few minutes after you publish.
    editor:
      preview: false
    files:
      - name: site
        label: Site details
        file: content/site.yml
        fields:
          - { name: name, label: Name, widget: string }
          - { name: tagline, label: Tagline (footer and browser tab), widget: string }
          - { name: email, label: Contact email, widget: string }
          - { name: scholar_url, label: Google Scholar link, widget: string }
          - { name: cv_file, label: CV file path, widget: string, hint: "Upload a new CV to assets/ with the same name to replace it" }
          - { name: site_url, label: Site address, widget: string }
          - { name: meta_description, label: Search engine description, widget: text }
          - { name: og_description, label: Social sharing description, widget: text }
          - { name: og_image, label: Social sharing image path, widget: string }

      - name: home
        label: Home page
        file: content/home.yml
        fields:
          - name: hero
            label: Top of page
            widget: object
            fields:
              - { name: kicker, label: Small line above the name, widget: string }
              - { name: heading, label: Name heading, widget: string }
              - { name: lede, label: Opening sentence, widget: text }
              - { name: role_title, label: Job title, widget: string }
              - { name: role_unit, label: Unit, widget: string }
              - { name: role_org, label: Organisation, widget: string }
              - { name: role_degree, label: Degree line, widget: string }
              - { name: button_primary, label: First button text, widget: string }
              - { name: button_secondary, label: Second button text, widget: string }
              - { name: image, label: Photo, widget: image, required: false }
              - { name: image_alt, label: Photo description (for screen readers), widget: string }
              - { name: image_species, label: Species name under photo, widget: string }
              - { name: image_caption, label: Common name under photo, widget: string }
          - name: strip
            label: Facts strip
            widget: list
            fields:
              - { name: label, label: Label, widget: string }
              - { name: value, label: Value, widget: string }
          - name: aside
            label: Side card
            widget: object
            fields:
              - { name: currently, label: Currently, widget: text }
              - { name: education, label: Education, widget: list, field: { name: item, label: Entry, widget: string } }
              - { name: previously, label: Previously, widget: list, field: { name: item, label: Entry, widget: string } }
              - { name: interests, label: Research interests, widget: list, field: { name: item, label: Interest, widget: string } }
          - name: about
            label: About section
            widget: object
            fields:
              - { name: kicker, label: Small label, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Text, widget: markdown }
          - name: research
            label: Research section
            widget: object
            fields:
              - { name: kicker, label: Small label, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: intro, label: Introduction, widget: text }
              - name: themes
                label: Research themes
                widget: list
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: body, label: Text, widget: text }
                  - { name: tags, label: Tags line, widget: string }
              - { name: link_text, label: Link text, widget: string }
          - name: publications
            label: Publications section
            widget: object
            fields:
              - { name: kicker, label: Small label, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: link_text, label: Link text, widget: string }
          - name: teaching
            label: Teaching section
            widget: object
            fields:
              - { name: kicker, label: Small label, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Text, widget: markdown }
              - { name: link_text, label: Link text, widget: string }
          - name: contact
            label: Contact section
            widget: object
            fields:
              - { name: kicker, label: Small label, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Text, widget: text }

